# CIEM GPT — gpt.ciem.pe
#
# Misma estructura que ciem-chat: nginx corta con limit_req (zona ciem_chat,
# declarada en conf.d/ciem-chat-rate.conf) y devuelve JSON cuando está ocupado.
#
# Instalación: sudo deploy/install.sh

server {
    listen 80;
    listen [::]:80;
    server_name gpt.ciem.pe;

    root /var/www/ciem-2027/ciem-gpt/public;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 32k;

    # Sin caché: los cambios se ven al recargar.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ── Chat (streaming SSE) ─────────────────────────────────────
    location = /api/ciem-gpt {
        limit_req zone=ciem_chat burst=6 nodelay;
        limit_req_status 429;
        error_page 429 = @ciem_gpt_busy;

        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        # El backend decide el proveedor; no necesita el Origin del navegador.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Cuota restante (sin streaming) ──────────────────────────
    location = /api/ciem-gpt/quota {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @ciem_gpt_busy {
        default_type application/json;
        return 429 '{"error": "busy", "message": "El asistente está ocupado. Intenta en un momento."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
